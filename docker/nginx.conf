server {
    listen 0.0.0.0:80;

    server_name  _;

    root /usr/share/nginx/html;

    index index.html;

    error_page   404              /404.html;
    error_page   500 502 503 504  /50x.html;

    location /assets/ {
        try_files $uri =404;
    }

    # Serve generated per-page Markdown (docusaurus-plugin-llms) as text so
    # LLM/agent clients receive markdown instead of an octet-stream download.
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        # Return a real 404 (served as the Docusaurus 404.html via error_page)
        # for paths that are neither a file nor a directory. Previously this
        # fell back to /index.html, which returned HTTP 200 for every unknown
        # URL (a soft-404 that misleads crawlers and AI agents). Existing files
        # and directories - including /img/* and /assets/* - are unaffected,
        # because the fallback only applies when neither $uri nor $uri/ exists.
        try_files $uri $uri/ =404;
    }
}
